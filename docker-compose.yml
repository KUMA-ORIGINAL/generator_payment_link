
services:
  backend:
    build:
      context: backend
    env_file:
      - .env.dev
    restart: unless-stopped
    volumes:
      - ./backend/app:/app
      - static_volume:/app/static
    ports:
      - '8000:8000'

  health-checker:
    build:
      context: ./checker
    container_name: checker
    restart: on-failure:5
    volumes:
      - ./checker:/app
    env_file:
      - ./checker/.env
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f checker.py || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

volumes:
  static_volume:
